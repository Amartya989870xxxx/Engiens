# Production profile (SPRING_PROFILES_ACTIVE=prod). Every secret and URL comes from the environment.

# Behind the reverse proxy (Caddy on the same host), which terminates HTTPS: trust its X-Forwarded-* headers so
# the client IP (rate limiting) and the scheme (HSTS) are the real ones. Only private/loopback proxies are trusted.
server.forward-headers-strategy=native

# Finish in-flight requests on deploy/restart instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# No localhost fallbacks in production: these must be set, or the backend refuses to start.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.frontend-url=${FRONTEND_URL}
