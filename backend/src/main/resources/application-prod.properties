# Production profile (SPRING_PROFILES_ACTIVE=prod), used by deploy/docker-compose.prod.yml on AWS EC2. Every secret and
# URL comes from the environment. The backend listens on 8080, reachable only by Caddy on the compose network.

# Behind Caddy, which terminates HTTPS: trust its X-Forwarded-* headers so the client IP (rate limiting) and the scheme
# (HSTS) are the real ones. Tomcat only trusts proxies on private/internal addresses, so clients can't spoof them.
server.forward-headers-strategy=native

# Finish in-flight requests on deploy/restart instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# No localhost fallbacks in production: these must be set, or the backend refuses to start.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.frontend-url=${FRONTEND_URL}
