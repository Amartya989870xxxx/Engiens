# Production profile (SPRING_PROFILES_ACTIVE=prod). Every secret and URL comes from the environment.

# Hosting platforms (Railway) tell the app which port to listen on through PORT; 8080 elsewhere (EC2 behind Caddy).
server.port=${PORT:8080}

# Behind the platform's HTTPS proxy: trust its X-Forwarded-* headers so the client IP (rate limiting) and the scheme
# (HSTS) are the real ones. Tomcat only trusts proxies on private/internal addresses, so clients can't spoof them.
server.forward-headers-strategy=native

# Finish in-flight requests on deploy/restart instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# No localhost fallbacks in production: these must be set, or the backend refuses to start.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.frontend-url=${FRONTEND_URL}

# Where scenario code runs is chosen per deployment. EC2 (deploy/docker-compose.prod.yml) sets
# SCENARIO_EXECUTION_PROVIDER=docker: the local Docker sandbox. The Railway fallback keeps this default, the Engiens
# runner service, because Railway can't start Docker containers.
scenario.execution.provider=${SCENARIO_EXECUTION_PROVIDER:runner}
