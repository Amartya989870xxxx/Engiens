spring.application.name=engineering-lens
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health
server.error.include-stacktrace=never

# Optional. Without a token GitHub allows 60 unauthenticated requests/hour per server IP.
app.github.token=${GITHUB_TOKEN:}

# Optional GitHub App for private repositories (see README). Without it, only public repos are supported.
app.github.app.id=${GITHUB_APP_ID:}
app.github.app.client-id=${GITHUB_APP_CLIENT_ID:}
app.github.app.client-secret=${GITHUB_APP_CLIENT_SECRET:}
app.github.app.slug=${GITHUB_APP_SLUG:}
app.github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
app.github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Insert repository file inventories in batches instead of one statement round trip per file.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# ---- AI review ----------------------------------------------------------------------------------
# Keys come only from the environment. With no key, that provider is skipped; with no provider at
# all, the app still starts and a review attempt reports that AI isn't configured.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# Preferred first. Unknown or retired models are detected at call time (404) and skipped.
ai.gemini.models=gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.base-url=https://api.groq.com/openai/v1
ai.groq.models=openai/gpt-oss-120b,qwen/qwen3.8-27b
ai.generation.temperature=0.2
ai.generation.max-output-tokens=32768
ai.generation.thinking=high
ai.retry.max-retries=2
ai.cooldown.initial=PT1M
ai.cooldown.max=PT30M

# ---- Scenario Lab code execution --------------------------------------------------------------------
# User code runs in throwaway Docker containers (no network, no secrets, strict limits), locally and in production on
# EC2. With Docker unavailable, or this set to false, Run is unavailable and labs fall back to approach-only scenarios.
scenario.execution.enabled=${SCENARIO_EXECUTION_ENABLED:true}
scenario.execution.max-concurrent=${SCENARIO_EXECUTION_MAX_CONCURRENT:2}
# Scenario generation limits (10/20-scenario labs build in parallel within these bounds).
scenario.generation.build-concurrency=${SCENARIO_BUILD_CONCURRENCY:3}
scenario.generation.build-calls-per-scenario=4
scenario.generation.deadline-base=PT10M
scenario.generation.deadline-per-scenario=PT90S
scenario.generation.spare-ratio=0.4
scenario.generation.harness-repairs=1
scenario.generation.plan-batch-size=14
# Per-user caps on actions that spend shared AI quota, per rolling 24 hours (0 = no cap).
app.limits.reviews-per-day=${REVIEWS_PER_DAY:10}
app.limits.labs-per-day=${LABS_PER_DAY:5}
# Login: attempts per IP and failed attempts per email per window; sign-ups per IP per window.
app.auth.limits.login-per-ip=20
app.auth.limits.login-failures-per-email=5
app.auth.limits.login-window=PT15M
app.auth.limits.register-per-ip=5
app.auth.limits.register-window=PT1H
