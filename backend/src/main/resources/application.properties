spring.application.name=engineering-lens
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health
server.error.include-stacktrace=never

# Optional. Without a token GitHub allows 60 unauthenticated requests/hour per server IP.
app.github.token=${GITHUB_TOKEN:}

# Optional GitHub App for private repositories (see README). Without it, only public repos are supported.
app.github.app.id=${GITHUB_APP_ID:}
app.github.app.client-id=${GITHUB_APP_CLIENT_ID:}
app.github.app.client-secret=${GITHUB_APP_CLIENT_SECRET:}
app.github.app.slug=${GITHUB_APP_SLUG:}
app.github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
app.github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Insert repository file inventories in batches instead of one statement round trip per file.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
