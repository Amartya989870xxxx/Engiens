spring.datasource.url=jdbc:h2:mem:lens;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=test-secret-test-secret-test-secret-123
app.review.async=false
app.scenario.async=false
# Tests must never call real AI providers, even though ../.env (imported by application.properties) has real keys.
ai.gemini.api-key=
ai.groq.api-key=
# The whole suite registers many users from one address (127.0.0.1); the limits have their own tests.
app.auth.limits.login-per-ip=100000
app.auth.limits.login-failures-per-email=100000
app.auth.limits.register-per-ip=100000
# Daily AI-action caps: off for the suite (users run many reviews and labs); UsageLimitTest uses real ones.
app.limits.reviews-per-day=0
app.limits.labs-per-day=0
