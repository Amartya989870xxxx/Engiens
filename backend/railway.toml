# Railway config-as-code for the backend service (service Root Directory: backend).
# https://docs.railway.com/reference/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only rebuild when backend code changes (paths are relative to the repository root).
watchPatterns = ["backend/**"]

[deploy]
# Railway waits for this to return 200 before switching traffic to a new deployment (Flyway runs before it is UP).
healthcheckPath = "/actuator/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
