# Railway config-as-code for the runner service (service Root Directory: runner). No public domain: the backend
# reaches it at http://<runner private domain>:8090 over Railway's private network.
# https://docs.railway.com/reference/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["runner/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
